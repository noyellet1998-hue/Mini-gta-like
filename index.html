<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VILLE LIBRE V14</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#98b9d3;font-family:system-ui;color:white;touch-action:none}canvas{display:block}#top{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 4px #000}button{background:#152938bd;color:white;border:1px solid #ffffff8a;border-radius:12px;padding:11px;font-weight:700}#toggle{pointer-events:auto;font-size:12px}#pad{position:fixed;inset:0;pointer-events:none}#joy{position:absolute;left:24px;bottom:calc(40px + env(safe-area-inset-bottom));width:132px;height:132px;border:2px solid #fff8;background:#fff2;border-radius:50%;pointer-events:auto;touch-action:none}#knob{position:absolute;left:43px;top:43px;width:44px;height:44px;border-radius:50%;background:#ffff}#buttons{position:absolute;right:15px;bottom:calc(45px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,85px);gap:9px;pointer-events:auto}#buttons button{padding:15px 4px}#intro{position:fixed;inset:0;background:linear-gradient(130deg,#101c2aef,#2e4551ec);display:flex;justify-content:center;align-items:center;text-align:center;padding:22px}#intro h1{font-size:clamp(36px,10vw,60px);margin:0}#intro p{max-width:360px;line-height:1.5}#start{background:#e8aa47;color:#1c2226;font-size:20px;padding:16px 45px}#status{font-size:12px}#error{color:#ffb1a0}</style></head><body><div id="top"><span id="status">VILLE LIBRE V14 · MANETTE OU TACTILE</span><button id="toggle">Masquer les commandes</button></div><div id="pad"><div id="joy"><div id="knob"></div></div><div id="buttons"><button id="action">ACTION</button><button id="run">COURIR</button><button id="brake">FREIN</button><button id="camera">CAMÉRA</button></div></div><div id="intro"><div><h1>VILLE LIBRE<br>V14</h1><p>Route panoramique, berline noire, collines boisées et ville à l'horizon. Manette Bluetooth ou commandes tactiles.</p><button id="start">▶ JOUER</button><p id="error"></p></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script><script>
'use strict';const $=s=>document.getElementById(s);let scene,camera,renderer,clock,hero,car,driving=false,started=false,heading=0,speed=0,camAngle=0,legL,legR,armL,armR;const input={x:0,y:0,run:false,brake:false},old={action:false},v=new THREE.Vector3();let manual=true;const M=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});function mesh(parent,geo,mat,x=0,y=0,z=0){const o=new THREE.Mesh(geo,mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function cube(p,w,h,d,x,y,z,m){return mesh(p,new THREE.BoxGeometry(w,h,d),m,x,y,z)}function sphere(p,r,x,y,z,m,segments=12){return mesh(p,new THREE.SphereGeometry(r,segments,10),m,x,y,z)}function cyl(p,rt,rb,h,x,y,z,m,n=10){return mesh(p,new THREE.CylinderGeometry(rt,rb,h,n),m,x,y,z)}function random(n){let t=Math.sin(n*127.1+23.7)*43758.5453;return t-Math.floor(t)}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0xa4c2d6);scene.fog=new THREE.FogExp2(0xa6bfd0,.0026);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,800);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.13;document.body.prepend(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0xe6f1ff,0x796d5b,2.1));let sun=new THREE.DirectionalLight(0xffd7a6,3);sun.position.set(-60,90,-35);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-95;sun.shadow.camera.right=95;sun.shadow.camera.top=95;sun.shadow.camera.bottom=-95;scene.add(sun);buildWorld();makeHero();makeCar();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});}
function buildWorld(){const earth=M(0x777c54),grass=M(0x668054),road=M(0x383d42),edge=M(0x9b9a91),line=M(0xe2cf98),stone=M(0x7b7b72),bark=M(0x615044),leaf=[M(0x34513a),M(0x426544),M(0x59734b),M(0x344d39)];const ground=mesh(scene,new THREE.PlaneGeometry(850,850,70,70),earth);ground.rotation.x=-Math.PI/2;let a=ground.geometry.attributes.position;for(let i=0;i<a.count;i++){let x=a.getX(i),y=a.getY(i);let elevation=Math.max(0,(Math.abs(x)-13)*.024)+Math.sin(x*.025)*1.6+Math.cos(y*.032)*1.4;if(Math.abs(x)<17)elevation=0;a.setZ(i,elevation)}ground.geometry.computeVertexNormals();const r=mesh(scene,new THREE.PlaneGeometry(17,650),road,0,.05,-75);r.rotation.x=-Math.PI/2;for(const s of [-1,1]){cube(scene,.14,.04,640,s*8,.085,-75,edge);for(let z=-370;z<235;z+=13)cube(scene,.16,.04,5,s*.1,.09,z,line)}for(let z=-370;z<235;z+=9)cube(scene,.14,.04,3,0,.09,z,line);
// Guard rails, posts and rocky roadside
for(let s of [-1,1])for(let z=-250;z<180;z+=9){cube(scene,.12,1.05,.12,s*10.4,.55,z,M(0x8d918d));if(z%3!==0)cube(scene,.12,.16,9,s*10.4,1.02,z+4.5,M(0xaeb0ab))}
for(let i=0;i<240;i++){let x=(random(i*2)-.5)*430,z=(random(i*2+1)-.5)*580;if(Math.abs(x)<21||z< -300&&Math.abs(x)<65)continue;let h=3+random(i+500)*7;const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);let base=Math.max(0,(Math.abs(x)-13)*.024)+Math.sin(x*.025)*1.6+Math.cos(z*.032)*1.4;g.position.y=base;cyl(g,.16,.28,h*.62,0,h*.31,0,bark,8);for(let j=0;j<3;j++){let canopy=sphere(g,1,0,h*.55+j*h*.14,0,leaf[(i+j)%leaf.length],9);canopy.scale.set(h*.19,h*.2,h*.19)}}for(let i=0;i<90;i++){let x=(random(i+1300)-.5)*200,z=(random(i+1800)-.5)*310;if(Math.abs(x)<13)continue;let y=Math.max(0,(Math.abs(x)-13)*.024)+Math.sin(x*.025)*1.6+Math.cos(z*.032)*1.4;let rock=mesh(scene,new THREE.DodecahedronGeometry(1+random(i+800)*2,0),stone,x,y+.6,z);rock.scale.set(1.4,.65,1)}
// distant city skyline, silhouettes and windows
const blocks=[0x858b8c,0x939a9a,0x717e83,0xa1a3a0];for(let i=0;i<90;i++){let x=(i-45)*8.5,z=-360-random(i+320)*65,h=16+random(i+900)*90,w=5+random(i+40)*7;let b=cube(scene,w,h,7,x,h/2-2,z,M(blocks[i%4]));b.castShadow=false;if(i%4===0){for(let j=0;j<8;j++)cube(scene,.6,.7,.07,x-w*.25,6+j*3,z+3.56,M(0xbac3bf))}}const hill=M(0x5f766b);for(let i=0;i<20;i++){let x=(i-10)*45,z=-450,h=40+random(i+90)*60;let m=mesh(scene,new THREE.ConeGeometry(65,h,5),hill,x,h/2-20,z);m.castShadow=false}}
function makeHero(){hero=new THREE.Group();scene.add(hero);hero.position.set(-3,0,9);const skin=M(0xa47b5c),black=M(0x1b2026),denim=M(0x2d3b51),hair=M(0x26221f),shoe=M(0x202125);let torso=cyl(hero,.31,.39,.94,0,1.63,0,black,12);torso.scale.z=.7;sphere(hero,.27,0,2.36,0,skin,16);let cap=sphere(hero,.28,0,2.57,-.025,hair,16);cap.scale.y=.35;for(let s of [-1,1]){let arm=new THREE.Group();arm.position.set(s*.43,1.98,0);hero.add(arm);cyl(arm,.145,.11,.75,0,-.38,0,black,10);sphere(arm,.115,0,-.8,0,skin);let leg=new THREE.Group();leg.position.set(s*.2,1.15,0);hero.add(leg);cyl(leg,.17,.14,.84,0,-.42,0,denim,10);cube(leg,.32,.15,.49,0,-.92,.12,shoe);if(s<0){armL=arm;legL=leg}else{armR=arm;legR=leg}}}
function makeCar(){car=new THREE.Group();scene.add(car);car.position.set(2.8,0,3);car.rotation.y=Math.PI;const paint=M(0x161b21,.25,.68),glass=M(0x233744,.15,.4),rubber=M(0x151619),chrome=M(0x969b9b,.3,.7),light=M(0xf4e7c6,.25),red=M(0xa31c21,.25);cube(car,1.92,.5,4.5,0,.75,0,paint);cube(car,1.8,.21,1.22,0,1.08,-1.52,paint);cube(car,1.8,.18,.9,0,1.08,1.73,paint);const outline=new THREE.Shape();outline.moveTo(-.8,0);outline.lineTo(-.62,.67);outline.lineTo(.62,.67);outline.lineTo(.8,0);outline.closePath();const cabin=mesh(car,new THREE.ExtrudeGeometry(outline,{depth:2,bevelEnabled:true,bevelThickness:.04,bevelSize:.035,bevelSegments:2}),glass,0,1.05,-1);cabin.rotation.x=-Math.PI/2;cube(car,1.52,.1,1.62,0,1.79,0,paint);for(let s of [-1,1]){for(let z of [-1.47,1.48]){let wheel=cyl(car,.43,.43,.24,s*1.01,.43,z,rubber,20);wheel.rotation.z=Math.PI/2;let rim=cyl(car,.23,.23,.25,s*1.03,.43,z,chrome,14);rim.rotation.z=Math.PI/2}cube(car,.38,.13,.07,s*.64,.81,-2.28,light);cube(car,.32,.15,.07,s*.65,.83,2.28,red);cube(car,.2,.12,.22,s*.99,1.29,-.65,paint);cube(car,.035,.045,1.25,s*.98,1.02,0,chrome)}cube(car,1.65,.15,.14,0,.49,-2.3,chrome);cube(car,1.65,.15,.14,0,.49,2.3,chrome)}
function action(){if(driving){driving=false;hero.visible=true;hero.position.copy(car.position);hero.position.x+=2;speed=0}else if(hero.position.distanceTo(car.position)<5){driving=true;hero.visible=false;heading=car.rotation.y;speed=0}}
function frame(){if(!started)return;requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.045),gp=navigator.getGamepads?.()[0];let x=input.x,y=input.y,run=input.run,brake=input.brake;if(gp){let gx=gp.axes[0]||0,gy=gp.axes[1]||0;if(Math.abs(gx)>.15)x=gx;if(Math.abs(gy)>.15)y=-gy;let rx=gp.axes[2]||0;if(Math.abs(rx)>.15)camAngle+=rx*dt*1.7;run ||= !!gp.buttons[1]?.pressed;brake ||= !!gp.buttons[6]?.pressed;if(gp.buttons[0]?.pressed&&!old.action)action();old.action=!!gp.buttons[0]?.pressed;if(driving){y=Math.max(y,gp.buttons[7]?.value||0);if(gp.buttons[6]?.value>0.1)y-=gp.buttons[6].value}}const target=driving?car:hero;if(driving){speed+=(y*11-speed*.5)*dt;if(brake)speed*=Math.pow(.85,dt*60);speed=Math.max(-8,Math.min(22,speed));heading-=x*dt*1.3*Math.sign(speed||1);car.rotation.y=heading;car.position.x+=Math.sin(heading)*speed*dt;car.position.z+=Math.cos(heading)*speed*dt}else{let l=Math.hypot(x,y);if(l>.1){heading=Math.atan2(x,y)+camAngle;hero.rotation.y=heading;hero.position.x+=Math.sin(heading)*dt*(run?8:4.2)*Math.min(l,1);hero.position.z+=Math.cos(heading)*dt*(run?8:4.2)*Math.min(l,1)}let swing=Math.sin(clock.elapsedTime*10)*Math.min(l,1)*.48;legL.rotation.x=swing;legR.rotation.x=-swing;armL.rotation.x=-swing;armR.rotation.x=swing}target.position.x=Math.max(-140,Math.min(140,target.position.x));target.position.z=Math.max(-300,Math.min(180,target.position.z));const angle=heading+camAngle,d=driving?10:6.5;v.set(target.position.x-Math.sin(angle)*d,target.position.y+(driving?5.2:4),target.position.z-Math.cos(angle)*d);camera.position.lerp(v,Math.min(1,dt*5));camera.lookAt(target.position.x,target.position.y+1.5,target.position.z+1);renderer.render(scene,camera)}
$('start').onclick=()=>{try{if(!window.THREE)throw Error('Three.js indisponible : vérifie la connexion Internet');init();started=true;$('intro').style.display='none';clock.start();frame()}catch(e){$('error').textContent=e.message;console.error(e)}};$('toggle').onclick=()=>{manual=!manual;$('pad').style.display=manual?'block':'none';$('toggle').textContent=manual?'Masquer les commandes':'Afficher les commandes'};$('action').onclick=action;$('camera').onclick=()=>camAngle+=Math.PI/2;for(let id of ['run','brake']){$(id).addEventListener('pointerdown',()=>input[id==='run'?'run':'brake']=true);for(let ev of ['pointerup','pointercancel','pointerleave'])$(id).addEventListener(ev,()=>input[id==='run'?'run':'brake']=false)}const joy=$('joy'),knob=$('knob');let pointer=null;function move(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),k=Math.min(1,50/(l||1));x*=k;y*=k;input.x=x/50;input.y=-y/50;knob.style.transform=`translate(${x}px,${y}px)`}joy.addEventListener('pointerdown',e=>{pointer=e.pointerId;joy.setPointerCapture(pointer);move(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===pointer)move(e)});function release(e){if(e.pointerId!==pointer)return;pointer=null;input.x=input.y=0;knob.style.transform=''}joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);window.addEventListener('gamepadconnected',()=>{$('status').textContent='🎮 MANETTE CONNECTÉE · V14';manual=false;$('pad').style.display='none';$('toggle').textContent='Afficher les commandes'});window.addEventListener('gamepaddisconnected',()=>{$('status').textContent='VILLE LIBRE V14 · TACTILE';manual=true;$('pad').style.display='block';$('toggle').textContent='Masquer les commandes'});
